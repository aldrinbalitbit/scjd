apply plugin: 'com.android.application'

android {
    compileSdkVersion 31
    buildToolsVersion "31.2.10"

    defaultConfig {
        applicationId "com.aldringames.scjd"
        minSdkVersion 19
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

